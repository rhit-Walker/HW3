<!DOCTYPE html>
<html>

<head>
    <title>Basic Form</title>
</head>

<body>
    <form method="POST" action="hello.html">
        <p><label>Username: <input type="text" name="username" id="username"></label></p>
        <p><label>Secret Passcode: <input type="text" name="secret_passcode" id="passcode"></label></p>
        <p><input type="submit" formenctype="text/plain" value="Submit as text/plain" id="submit"></p>
        <p><input type="submit" formenctype="application/x-www-form-urlencoded"value="Submit as application/x-www-form-urlencoded" id="submit-urlencoded"></p>
    </form>
</body>

</html>
