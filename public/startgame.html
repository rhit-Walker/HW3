<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Game</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Linear Lights Out</h1>

    <p>Turn all the lights from O to X.</p>
    <p>Clicking a light also changes the lights next to it.</p>

    <form action="/game.html" method="post">
        <p>
            <label for="player_name">Player name:</label>
            <input type="text" id="player_name" name="player_name" required>
        </p>

        <p>
            <label for="number_of_lights">Number of lights:</label>
            <input type="number" id="number_of_lights" name="number_of_lights" min="1" value="4" required>
        </p>

        <p>
            <label for="off_lights">Lights starting off:</label>
            <input type="number" id="off_lights"name="off_lights" min="0" value="2" required>
        </p>

        <button type="submit">Start game</button>
    </form>

    <p><a href="/game.html">Rejoin current game</a></p>
    <p><a href="/best_scores.html">View best scores</a></p>
</body>
</html>
